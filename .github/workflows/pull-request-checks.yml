name: Test and audit pull requests

on:
  pull_request:
    branches:
      - main

jobs:
  call-security:
    uses: vestfoldfylke/shared/.github/workflows/dotnet-security.yml@main
    with:
      dotnet_version: "10.0.x"
      framework_version: "net10.0"

  call-node-security:
    uses: vestfoldfylke/shared/.github/workflows/npm-security.yml@main
    with:
      package_path: "kisatsingen"
